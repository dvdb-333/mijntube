<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MijnTube">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Mijn Tube</title>
<style>
:root{--bg:#0f0f10;--card:#18181b;--card2:#202024;--line:#2c2c31;--text:#ededee;--muted:#9a9aa2;--dim:#66666e;--accent:#ff5a4e;--accent2:#ffb36b;--ok:#6fd39a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button:hover{border-color:#44444b}
header{position:sticky;top:0;z-index:5;background:rgba(15,15,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.logo{font-weight:700;letter-spacing:.2px;font-size:18px}
.logo span{color:var(--accent)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:none;color:var(--muted);padding:6px 12px;border-radius:999px}
.tab.on{background:var(--card2);color:var(--text)}
.sp{flex:1}
.status{color:var(--dim);font-size:12px}
main{max-width:1280px;margin:0 auto;padding:20px}
h2{font-size:15px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px 16px}
.v{position:relative;min-width:0}
.th{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);font-size:11px;padding:1px 5px;border-radius:4px}
.v.seen .th img{opacity:.35}
.v.seen .th::after{content:"✓ gezien";position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.8);padding:1px 6px;border-radius:4px}
.t{font-size:14px;font-weight:500;margin:8px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.m{font-size:12px;color:var(--muted)}
.m b{font-weight:500;color:#c9c9cf}
.badge{display:inline-block;font-size:11px;color:var(--accent2);border:1px solid #4a3a2a;border-radius:999px;padding:0 7px;margin-top:5px}
.acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.acts button{padding:3px 9px;font-size:12px}
.acts .up.on{border-color:var(--ok);color:var(--ok)}
.more{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);border:none;border-radius:6px;padding:2px 8px;opacity:0;transition:.15s}
.v:hover .more{opacity:1}
.menu{position:absolute;top:32px;right:6px;z-index:3;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:170px}
.menu button{border:none;background:none;text-align:left;padding:7px 10px;font-size:13px}
.menu button:hover{background:#2a2a30}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.filters input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:220px}
.chip{font-size:13px;padding:4px 11px;border-radius:999px}
.chip.on{background:var(--text);color:#111;border-color:var(--text)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.player{width:min(1100px,100%)}
.player .frame{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}
.player .row{display:flex;align-items:center;gap:10px;margin-top:10px}
.player a{color:var(--accent2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}
.panel label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.panel input[type=text],.panel input[type=number],.panel textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.panel textarea{min-height:200px}
.key{font-family:ui-monospace,Menlo,monospace}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.prog{height:2px;background:var(--accent);width:0;transition:width .2s}
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media (max-width:640px){
 .bar{flex-wrap:wrap;gap:10px;padding:10px 14px}
 .logo{font-size:17px}
 .tabs{order:3;width:100%}
 .tab{flex:1;padding:8px}
 .status{display:none}
 main{padding:14px}
 .strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -14px 28px;padding:0 14px}
 .strip .v{flex:0 0 72%;scroll-snap-align:start}
 .grid{grid-template-columns:1fr;gap:18px}
 .more{opacity:1}
 .acts button{padding:6px 10px}
 .filters input[type=search]{min-width:0;flex:1}
 .modal{padding:0;align-items:flex-start;padding-top:env(safe-area-inset-top)}
 .player .frame{border-radius:0}
 .player .row{padding:0 14px;flex-wrap:wrap}
 .panel{border-radius:0;max-height:100vh;height:100%}
}
</style>
</head>

</header>
<main id="main"></main>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function topicsList(){
  return S.topics.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [q, cat] = l.split('|'); return {q:q.trim(), cat:(cat||'overig').trim()}; });
}
function allSubs(){ return SUBS.concat(S.extra).filter(s => !S.muted[s.id]); }
function subIds(){ return new Set(SUBS.concat(S.extra).map(s => s.id)); }

function addQuota(n){
  if (S.quota.day !== today()) S.quota = {day: today(), used: 0};
  S.quota.used += n; save('quota');
}
async function api(path, params, cost=1){
  if (!S.key) throw new Error('nokey');
  const qs = new URLSearchParams({...params, key: S.key});
  addQuota(cost);
  const r = await fetch('https://www.googleapis.com/youtube/v3/' + path + '?' + qs);
  const j = await r.json();
  if (j.error) { const e = new Error(j.error.message); e.code = j.error.code; e.reason = j.error.errors?.[0]?.reason; throw e; }
  return j;
}
function setStatus(t){ $('#status').textContent = t; }
function prog(p){ $('#prog').style.width = (p*100) + '%'; if (p >= 1) setTimeout(() => $('#prog').style.width = '0', 400); }

function parseDur(iso){
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || '') || [];
  return (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0);
}
function fmtDur(s){
  if (!s) return '';
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0');
}
function ago(d){
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s/60)) + ' min geleden';
  if (s < 86400) return Math.round(s/3600) + ' u geleden';
  const days = Math.round(s/86400);
  return days === 1 ? 'gisteren' : days + ' dagen geleden';
}
function fmtSubs(n){ n = +n; return n >= 1000 ? (n/1000).toFixed(n < 10000 ? 1 : 0).replace('.', ',') + 'K' : String(n); }

async function details(ids){
  const out = {};
  for (let i = 0; i < ids.length; i += 50) {
    const j = await api('videos', {part:'contentDetails,statistics', id: ids.slice(i,i+50).join(',')});
    j.items.forEach(v => out[v.id] = {dur: parseDur(v.contentDetails.duration), views: +(v.statistics?.viewCount||0)});
  }
  return out;
}

async function loadFeed(){
  const subs = allSubs();
  const since = Date.now() - S.days*86400000;
  const vids = []; let done = 0, errors = 0;
  setStatus('Kanalen laden…');
  const queue = subs.slice();
  async function worker(){
    while (queue.length) {
      const s = queue.shift();
      try {
        const j = await api('playlistItems', {part:'snippet,contentDetails', playlistId: 'UU' + s.id.slice(2), maxResults: 6});
        j.items.forEach(it => {
          const d = it.contentDetails.videoPublishedAt || it.snippet.publishedAt;
          if (new Date(d) > since && it.snippet.title !== 'Private video')
            vids.push({id: it.contentDetails.videoId, title: it.snippet.title, ch: s.id, chName: s.n, date: d, thumb: it.snippet.thumbnails?.medium?.url});
        });
      } catch(e) { errors++; if (e.reason === 'quotaExceeded' || e.message === 'nokey' || e.code === 400) { queue.length = 0; throw e; } }
      done++; prog(done/subs.length); setStatus('Kanalen laden… ' + done + '/' + subs.length);
    }
  }
  await Promise.all(Array.from({length: 8}, worker));
  const det = await details(vids.map(v => v.id));
  vids.forEach(v => Object.assign(v, det[v.id] || {}));
  vids.sort((a,b) => new Date(b.date) - new Date(a.date));
  S.feed = {at: Date.now(), vids}; save('feed');
}

function pickTopics(n){
  const pool = topicsList().map(t => ({...t, w: Math.max(0.2, 1 + (S.weights[t.q]||0))}));
  const out = [];
  while (out.length < n && pool.length) {
    const sum = pool.reduce((a,t) => a + t.w, 0);
    let r = Math.random() * sum, i = 0;
    while (r > pool[i].w) { r -= pool[i].w; i++; }
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}

async function loadDisc(){
  const topics = pickTopics(5);
  const have = subIds();
  const after = new Date(Date.now() - 60*86400000).toISOString();
  let cands = [];
  for (let i = 0; i < topics.length; i++) {
    const t = topics[i];
    setStatus('Ontdekken: ' + t.q);
    prog((i+0.5)/(topics.length+1));
    const j = await api('search', {part:'snippet', type:'video', q: t.q, maxResults: 40, publishedAfter: after, videoDuration:'medium', safeSearch:'moderate'}, 100);
    j.items.forEach(it => {
      if (have.has(it.snippet.channelId) || S.blocked[it.snippet.channelId]) return;
      cands.push({id: it.id.videoId, title: it.snippet.title.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"'), ch: it.snippet.channelId, chName: it.snippet.channelTitle, date: it.snippet.publishedAt, thumb: it.snippet.thumbnails?.medium?.url, topic: t.q, cat: t.cat});
    });
  }
  const chs = [...new Set(cands.map(c => c.ch))];
  const subsOf = {};
  for (let i = 0; i < chs.length; i += 50) {
    const j = await api('channels', {part:'statistics', id: chs.slice(i,i+50).join(',')});
    j.items.forEach(c => subsOf[c.id] = c.statistics.hiddenSubscriberCount ? null : +c.statistics.subscriberCount);
  }
  cands = cands.filter(c => subsOf[c.ch] != null && subsOf[c.ch] <= S.maxSubs && subsOf[c.ch] >= 30);
  const perCh = {};
  cands = cands.filter(c => (perCh[c.ch] = (perCh[c.ch]||0) + 1) <= 2);
  const det = await details(cands.map(c => c.id));
  cands.forEach(c => { Object.assign(c, det[c.id] || {}); c.subs = subsOf[c.ch]; });
  cands.forEach(c => {
    const tw = 1 + (S.weights[c.topic]||0) * 0.3;
    const cw = 1 + (S.chanScore[c.ch]||0) * 0.5;
    const small = 1 + 0.4 * (1 - Math.min(1, c.subs / S.maxSubs));
    const engage = c.subs ? Math.min(2, Math.log10(1 + (c.views||0)) / Math.log10(10 + c.subs)) : 1;
    c.score = tw * cw * small * (0.6 + 0.4*engage) * (0.85 + Math.random()*0.3);
  });
  cands.sort((a,b) => b.score - a.score);
  S.disc = {at: Date.now(), day: today(), vids: cands, topics: topics.map(t => t.q)}; save('disc');
  prog(1);
}

function card(v, opts={}){
  const seen = S.seen[v.id] ? ' seen' : '';
  const vote = S.votes[v.id] || 0;
  return `<div class="v${seen}" data-id="${v.id}">
    <div class="th" data-play="${v.id}"><img loading="lazy" src="${esc(v.thumb)}" alt="">${v.dur ? `<span class="dur">${fmtDur(v.dur)}</span>` : ''}</div>
    <button class="more" data-more="${v.id}" aria-label="Meer">⋯</button>
    <div class="t" data-play="${v.id}">${esc(v.title)}</div>
    <div class="m"><b>${esc(v.chName)}</b> · ${ago(v.date)}</div>
    ${opts.disc ? `<span class="badge">${fmtSubs(v.subs)} abonnees</span>
    <div class="acts">
      <button class="up${vote>0?' on':''}" data-vote="1" data-v="${v.id}">▲ meer zoals dit</button>
      <button data-vote="-1" data-v="${v.id}">▼ minder</button>
      <button data-follow="${v.ch}" data-name="${esc(v.chName)}">+ volg</button>
    </div>` : ''}
  </div>`;
}

function feedVids(){
  let vids = S.feed?.vids || [];
  const allowed = new Set(allSubs().map(s => s.id));
  vids = vids.filter(v => allowed.has(v.ch));
  if (S.hideShorts) vids = vids.filter(v => !v.dur || v.dur > 180);
  if (filterNew) vids = vids.filter(v => !S.seen[v.id]);
  if (filterQ) { const q = filterQ.toLowerCase(); vids = vids.filter(v => v.title.toLowerCase().includes(q) || v.chName.toLowerCase().includes(q)); }
  return vids;
}
function discVids(){
  return (S.disc?.vids || []).filter(v => !S.blocked[v.ch] && (S.votes[v.id]||0) >= 0 && !subIds().has(v.ch));
}

      ${vids.length ? `<div class="grid">${vids.map(v => card(v)).join('')}</div>` : `<div class="empty">${S.feed ? 'Geen video\'s gevonden.' : 'Klik op ↻ Ververs om je kanalen te laden.'}</div>`}`;
    const q = $('#q'); q.oninput = () => { filterQ = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p,p); };
    $('#fNew').onclick = () => { filterNew = !filterNew; render(); };
  } else {
    m.innerHTML = `<h2>Ontdekken</h2><p class="sub">${S.disc ? 'Onderwerpen vandaag: ' + esc(S.disc.topics.join(', ')) + ' · max ' + fmtSubs(S.maxSubs) + ' abonnees' : ''}</p>
      ${disc.length ? `<div class="grid">${disc.map(v => card(v,{disc:true})).join('')}</div>` : `<div class="empty">${S.disc ? 'Niks meer over. Klik ↻ Ververs voor nieuwe ontdekkingen.' : 'Klik op ↻ Ververs om te ontdekken.'}</div>`}`;
  }
  const qu = S.quota.day === today() ? S.quota.used : 0;
  setStatus(qu ? 'API vandaag: ' + qu + ' / 10.000' : '');
}

function findVid(id){ return (S.feed?.vids||[]).concat(S.disc?.vids||[]).find(v => v.id === id); }

function play(id){
  S.seen[id] = Date.now(); save('seen');
  const v = findVid(id) || {};
  $('#layer').innerHTML = `<div class="modal" id="mod"><div class="player">
    <div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <div class="row"><div style="flex:1"><div style="font-weight:500">${esc(v.title)}</div><div class="m">${esc(v.chName)}</div></div>
    <a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">Open op YouTube ↗</a>
    <button id="close">✕ Sluiten</button></div></div></div>`;
  $('#close').onclick = closeLayer;
  $('#mod').onclick = e => { if (e.target.id === 'mod') closeLayer(); };
}
function closeLayer(){ $('#layer').innerHTML = ''; render(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#layer').innerHTML) closeLayer(); });

function vote(id, d){
  const v = findVid(id); if (!v) return;
  const prev = S.votes[id] || 0;
  S.votes[id] = prev === d ? 0 : d;
  const delta = S.votes[id] - prev;
  if (v.topic) S.weights[v.topic] = Math.max(-0.8, Math.min(5, (S.weights[v.topic]||0) + delta*(delta > 0 ? 0.5 : 0.4)));
  S.chanScore[v.ch] = (S.chanScore[v.ch]||0) + delta;
  if (S.chanScore[v.ch] <= -2) S.blocked[v.ch] = 1;
  save('votes','weights','chanScore','blocked'); render();
}
function follow(ch, name){
  if (!S.extra.find(s => s.id === ch)) S.extra.push({id: ch, n: name});
  save('extra');
  const vids = (S.disc?.vids || []).filter(v => v.ch === ch);
  if (S.feed) { S.feed.vids = vids.map(v => ({...v})).concat(S.feed.vids).sort((a,b) => new Date(b.date) - new Date(a.date)); save('feed'); }
  setStatus(name + ' toegevoegd aan Mijn kanalen'); render();
}

function openMenu(id, btn){
  closeMenus();
  const v = findVid(id); if (!v) return;
  const isSub = subIds().has(v.ch);
  const div = document.createElement('div'); div.className = 'menu';
  div.innerHTML = `<a href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener" style="display:block;padding:7px 10px;font-size:13px;color:inherit;text-decoration:none">Open op YouTube ↗</a>
    <button data-m="seen">${S.seen[id] ? 'Markeer als niet gezien' : 'Markeer als gezien'}</button>
    ${isSub ? `<button data-m="mute">Verberg dit kanaal</button>` : `<button data-m="block">Nooit meer tonen</button>`}`;
  btn.closest('.v').appendChild(div);
  div.onclick = e => {
    const a = e.target.dataset.m; if (!a) return;
    if (a === 'seen') { if (S.seen[id]) delete S.seen[id]; else S.seen[id] = Date.now(); save('seen'); }
    if (a === 'mute') { S.muted[v.ch] = 1; save('muted'); }
    if (a === 'block') { S.blocked[v.ch] = 1; save('blocked'); }
    render();
  };
}
function closeMenus(){ document.querySelectorAll('.menu').forEach(m => m.remove()); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-play],[data-vote],[data-follow],[data-more],[data-tab]');
  if (!t) { if (!e.target.closest('.menu')) closeMenus(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0,0); }
  else if (t.dataset.play) play(t.dataset.play);
  else if (t.dataset.vote) vote(t.dataset.v, +t.dataset.vote);
  else if (t.dataset.follow) follow(t.dataset.follow, t.dataset.name);
  else if (t.dataset.more) { e.stopPropagation(); openMenu(t.dataset.more, t); }
});

function openSettings(){
  const mutedNames = SUBS.concat(S.extra).filter(s => S.muted[s.id]).map(s => s.n);
  $('#layer').innerHTML = `<div class="modal" id="mod"><div class="panel">
    <h2>Instellingen</h2>
    <label>YouTube API-key</label>
    <input type="text" id="sKey" class="key" value="${esc(S.key)}" placeholder="AIza…">
    <div class="hint">Wordt alleen in deze browser bewaard.</div>
    <label>Ontdek-onderwerpen (één per regel, optioneel |categorie)</label>
    <textarea id="sTopics">${esc(S.topics)}</textarea>
    <div class="hint">Elke verversing kiest er 5. Onderwerpen waar je ▲ op geeft komen vaker terug.</div>
    <label>Maximaal aantal abonnees voor ontdekte kanalen</label>
    <input type="number" id="sMax" value="${S.maxSubs}" min="100" step="1000">
    <label>Hoeveel dagen terug in Mijn kanalen</label>
    <input type="number" id="sDays" value="${S.days}" min="1" max="60">
    <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="sShorts" ${S.hideShorts?'checked':''}> Shorts en filmpjes korter dan 3 minuten verbergen</label>
    ${mutedNames && mutedNames.length ? `<label>Verborgen kanalen</label><div class="hint">${esc(mutedNames.join(', '))}</div><button id="unmute" style="margin-top:6px">Alle verborgen kanalen terugzetten</button>` : ''}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
      <button id="cancel">Annuleren</button><button id="saveSet" style="background:var(--accent);border-color:var(--accent);color:#fff">Opslaan</button>
    </div></div></div>`;
  $('#cancel').onclick = closeLayer;
  if ($('#unmute')) $('#unmute').onclick = () => { S.muted = {}; save('muted'); openSettings(); };
  $('#saveSet').onclick = () => {
    const hadKey = !!S.key;
    S.key = $('#sKey').value.trim(); S.topics = $('#sTopics').value; S.maxSubs = +$('#sMax').value || 20000;
    S.days = +$('#sDays').value || 14; S.hideShorts = $('#sShorts').checked;
    save('key','topics','maxSubs','days','hideShorts'); closeLayer();
    if (!hadKey && S.key) refresh();
  };
}
$('#settingsBtn').onclick = openSettings;

let busy = false;
async function refresh(){
  if (busy || !S.key) { if (!S.key) openSettings(); return; }
  busy = true; $('#refresh').disabled = true;
  try {
    if (tab === 'feed') { await loadFeed(); if (!S.disc || S.disc.day !== today()) await loadDisc(); }
    else await loadDisc();
  } catch(e) {
    setStatus(e.reason === 'quotaExceeded' ? 'Daglimiet van YouTube bereikt, morgen weer.' : 'Fout: ' + e.message);
    busy = false; $('#refresh').disabled = false; render(); setStatus(e.reason === 'quotaExceeded' ? 'Daglimiet van YouTube bereikt, morgen weer.' : 'Fout: ' + e.message); return;
  }
  busy = false; $('#refresh').disabled = false; render();
}
$('#refresh').onclick = refresh;

render();
if (S.key && (!S.feed || Date.now() - S.feed.at > 3*3600000)) refresh();
</script>
</body>
</html>
